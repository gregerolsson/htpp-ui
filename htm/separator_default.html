<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>separator_default</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div class="flex flex-col gap-4 items-center w-full max-w-md">
      <p>Top</p>
      <div role="separator" aria-orientation="horizontal" class="shrink-0 w-full">
        <div class="relative flex items-center w-full">
          <span class="absolute w-full border-t h-[1px] border-dashed" aria-hidden="true"/>
          <span class="relative mx-auto bg-background px-2 text-xs text-muted-foreground"/>
        </div>
      </div>
      <p>Bottom</p>
    </div>
  </body>
</html>
