<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>

    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div id="account-tabs" class="flex flex-col gap-2" data-tui-tabs="" data-tui-tabs-id="account-tabs">
      <div class="bg-muted text-muted-foreground inline-flex h-9 w-fit items-center justify-center rounded-lg p-[3px] w-full max-w-xs" data-tui-tabs-list="">
        <button type="button" class="data-[tui-tabs-state=active]:bg-background dark:data-[tui-tabs-state=active]:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:outline-ring dark:data-[tui-tabs-state=active]:border-input dark:data-[tui-tabs-state=active]:bg-input/30 text-foreground dark:text-muted-foreground inline-flex h-[calc(100%-1px)] flex-1 items-center justify-center gap-1.5 rounded-md border border-transparent px-2 py-1 text-sm font-medium whitespace-nowrap transition-[color,box-shadow] focus-visible:ring-[3px] focus-visible:outline-1 disabled:pointer-events-none disabled:opacity-50 data-[tui-tabs-state=active]:shadow-sm [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4" data-tui-tabs-trigger="" data-tui-tabs-id="account-tabs" data-tui-tabs-value="account" data-tui-tabs-state="active">Account</button>
        <button type="button" class="data-[tui-tabs-state=active]:bg-background dark:data-[tui-tabs-state=active]:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:outline-ring dark:data-[tui-tabs-state=active]:border-input dark:data-[tui-tabs-state=active]:bg-input/30 text-foreground dark:text-muted-foreground inline-flex h-[calc(100%-1px)] flex-1 items-center justify-center gap-1.5 rounded-md border border-transparent px-2 py-1 text-sm font-medium whitespace-nowrap transition-[color,box-shadow] focus-visible:ring-[3px] focus-visible:outline-1 disabled:pointer-events-none disabled:opacity-50 data-[tui-tabs-state=active]:shadow-sm [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4" data-tui-tabs-trigger="" data-tui-tabs-id="account-tabs" data-tui-tabs-value="password" data-tui-tabs-state="inactive">Password</button>
      </div>
      <div class="w-full max-w-xs mt-2">
        <div class="flex-1 outline-none" data-tui-tabs-content="" data-tui-tabs-id="account-tabs" data-tui-tabs-value="account" data-tui-tabs-state="active">
          <div class="w-full rounded-lg border bg-card text-card-foreground shadow-xs">
            <div class="flex flex-col space-y-1.5 p-6 pb-0">
              <h3 class="text-lg font-semibold leading-none tracking-tight">Account</h3>
              <p class="text-sm text-muted-foreground">Make changes to your account here. Click save when you are done.</p>
            </div>
            <div class="p-6">
              <div class="flex flex-col gap-4">
                <div class="relative w-full">
                  <input id="name" type="text" placeholder="Name" value="John Doe" class="flex h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none md:text-sm dark:bg-input/30 selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:ring-destructive/20 aria-invalid:border-destructive dark:aria-invalid:ring-destructive/40"/>
                </div>
                <div class="relative w-full">
                  <input id="email" type="email" placeholder="Email" value="john.doe@example.com" class="flex h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none md:text-sm dark:bg-input/30 selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:ring-destructive/20 aria-invalid:border-destructive dark:aria-invalid:ring-destructive/40"/>
                </div>
              </div>
            </div>
            <div class="flex items-center p-6 pt-0">
              <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive cursor-pointer bg-primary text-primary-foreground shadow-xs hover:bg-primary/90 h-9 px-4 py-2 has-[&gt;svg]:px-3" type="button">Save changes</button>
            </div>
          </div>
        </div>
        <div class="flex-1 outline-none hidden" data-tui-tabs-content="" data-tui-tabs-id="account-tabs" data-tui-tabs-value="password" data-tui-tabs-state="inactive">
          <div class="w-full rounded-lg border bg-card text-card-foreground shadow-xs">
            <div class="flex flex-col space-y-1.5 p-6 pb-0">
              <h3 class="text-lg font-semibold leading-none tracking-tight">Password</h3>
              <p class="text-sm text-muted-foreground">Change your password here. After saving, you will be logged out.</p>
            </div>
            <div class="p-6">
              <div class="flex flex-col gap-4">
                <div class="relative w-full">
                  <input id="current_password" type="password" placeholder="Current Password" class="flex h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none md:text-sm dark:bg-input/30 selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:ring-destructive/20 aria-invalid:border-destructive dark:aria-invalid:ring-destructive/40 pr-8"/>
                  <button class="absolute right-0 top-1/2 -translate-y-1/2 opacity-50 cursor-pointer" data-tui-input-toggle-password="current_password" type="button">
                    <span class="icon-open block"/>
                    <span class="icon-closed hidden"/>
                  </button>
                </div>
                <div class="relative w-full">
                  <input id="new_password" type="password" placeholder="New Password" class="flex h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none md:text-sm dark:bg-input/30 selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:ring-destructive/20 aria-invalid:border-destructive dark:aria-invalid:ring-destructive/40 pr-8"/>
                  <button class="absolute right-0 top-1/2 -translate-y-1/2 opacity-50 cursor-pointer" data-tui-input-toggle-password="new_password" type="button">
                    <span class="icon-open block"/>
                    <span class="icon-closed hidden"/>
                  </button>
                </div>
              </div>
            </div>
            <div class="flex items-center p-6 pt-0">
              <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive cursor-pointer bg-primary text-primary-foreground shadow-xs hover:bg-primary/90 h-9 px-4 py-2 has-[&gt;svg]:px-3" type="button">Save password</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
