<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>tagsinput_form</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div class="w-full max-w-sm">
      <div class="space-y-2">
        <label for="tags-form" class="text-sm font-medium leading-none inline-block">Net</label>
        <div id="tags-form-container" class="flex flex-col gap-2 p-2 rounded-md border border-destructive bg-transparent shadow-xs transition-[color,box-shadow] outline-none dark:bg-input/30 focus-within:border-ring focus-within:ring-ring/50 focus-within:ring-[3px] w-full ring-destructive/20 dark:ring-destructive/40" data-tui-tagsinput="" data-tui-tagsinput-name="" data-tui-tagsinput-form="">
          <div class="flex flex-wrap gap-2 empty:hidden" data-tui-tagsinput-chips=""/>
          <div class="relative w-full">
            <input id="tags-form" class="border-0 shadow-none focus-visible:ring-0 h-auto py-0 px-0 bg-transparent rounded-none min-h-0 w-full outline-none" type="text" placeholder="Enter a network" data-tui-tagsinput-text-input=""/>
          </div>
          <div class="hidden" data-tui-tagsinput-hidden-inputs=""/>
        </div>
        <p class="text-sm text-muted-foreground">Enter a network in format like '1.1.1.1/32'</p>
        <p class="text-red-500 font-medium">Please enter a valid network in format like '1.1.1.1/32'</p>
      </div>
    </div>
  </body>
</html>
