<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>dialog_external_trigger</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div class="space-y-4">
      <span data-tui-dialog-trigger="" data-tui-dialog-target="external-dialog" data-tui-dialog-trigger-open="false" class="contents">
        <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive cursor-pointer border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground dark:bg-input/30 dark:border-input dark:hover:bg-input/50 h-9 px-4 py-2 has-[&gt;svg]:px-3" type="button">Open External Dialog</button>
      </span>
      <div id="external-dialog" data-tui-dialog="" data-tui-dialog-open="false" class="contents">
        <dialog class="fixed left-[50%] top-[50%] z-50 m-0 w-full max-w-[calc(100%-2rem)] -translate-x-1/2 -translate-y-1/2 overflow-hidden border bg-background text-foreground p-0 shadow-lg outline-none sm:max-w-lg [&amp;:not([open]):not([data-tui-dialog-closing=true])]:hidden rounded-lg [&amp;::backdrop]:transition-all [&amp;::backdrop]:duration-200 data-[tui-dialog-open=false]:[&amp;::backdrop]:bg-black/0 data-[tui-dialog-open=true]:[&amp;::backdrop]:bg-black/50 transition-all duration-200 data-[tui-dialog-open=false]:scale-95 data-[tui-dialog-open=true]:scale-100 data-[tui-dialog-open=false]:opacity-0 data-[tui-dialog-open=true]:opacity-100 max-w-md" data-tui-dialog-content="" data-tui-dialog-show-modal="true">
          <div class="relative grid gap-4 p-6" data-tui-dialog-panel="">
            <div class="flex flex-col gap-2 text-center sm:text-left">
              <h2 class="text-lg leading-none font-semibold">External Dialog</h2>
              <p class="text-muted-foreground text-sm">This dialog can be triggered from anywhere on the page.</p>
            </div>
            <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
              <span data-tui-dialog-close="" class="contents cursor-pointer">
                <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive cursor-pointer bg-primary text-primary-foreground shadow-xs hover:bg-primary/90 h-9 px-4 py-2 has-[&gt;svg]:px-3" type="button">Close</button>
              </span>
            </div>
            <button class="absolute top-4 right-4 rounded-xs opacity-70 transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 ring-offset-background disabled:pointer-events-none [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4" data-tui-dialog-close="" aria-label="Close" type="button">
              <span class="sr-only">Close</span>
            </button>
          </div>
        </dialog>
      </div>
    </div>
  </body>
</html>
