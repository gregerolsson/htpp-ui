<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>popover_default</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div data-tui-popover-root="" class="contents">
      <span class="contents" data-tui-popover-trigger="" data-tui-popover-type="hover">
        <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive cursor-pointer border bg-background shadow-xs hover:bg-accent hover:text-accent-foreground dark:bg-input/30 dark:border-input dark:hover:bg-input/50 h-9 px-4 py-2 has-[&gt;svg]:px-3" type="button">Open Popover</button>
      </span>
      <div popover="manual" data-tui-popover-content="" data-tui-popover-open="false" data-tui-popover-placement="top" data-tui-popover-offset="4" data-tui-popover-disable-clickaway="false" data-tui-popover-disable-esc="false" data-tui-popover-show-arrow="false" data-tui-popover-hover-delay="0" data-tui-popover-hover-out-delay="0" data-tui-popover-exclusive="false" class="bg-popover rounded-lg border text-popover-foreground text-sm shadow-lg pointer-events-auto fixed inset-auto top-0 left-0 m-0 max-w-[min(24rem,calc(100vw-2rem))] overflow-visible outline-none transition-opacity duration-150 ease-out data-[tui-popover-open=false]:opacity-0 data-[tui-popover-open=true]:opacity-100 motion-reduce:transition-none">
        <div class="w-full overflow-hidden">
          <div class="p-4 space-y-4">
            <div>
              <h3 class="text-lg font-semibold">Dimensions</h3>
              <p>Set the dimensions for the layer.</p>
            </div>
            <div class="flex flex-col gap-2 max-w-fit">
              <div class="flex items-center gap-2">
                <label for="width" class="text-sm font-medium leading-none inline-block w-24" data-tui-label-disabled-style="opacity-50 cursor-not-allowed">Width</label>
                <div class="relative w-full">
                  <input id="width" type="text" placeholder="Width" value="100%" class="flex h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none md:text-sm dark:bg-input/30 selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:ring-destructive/20 aria-invalid:border-destructive dark:aria-invalid:ring-destructive/40 flex-1"/>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <label for="height" class="text-sm font-medium leading-none inline-block w-24" data-tui-label-disabled-style="opacity-50 cursor-not-allowed">Height</label>
                <div class="relative w-full">
                  <input id="height" type="text" placeholder="Height" value="100%" class="flex h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none md:text-sm dark:bg-input/30 selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:ring-destructive/20 aria-invalid:border-destructive dark:aria-invalid:ring-destructive/40 flex-1"/>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
