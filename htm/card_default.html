<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>card_default</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div class="w-full max-w-sm">
      <div class="w-full rounded-lg border bg-card text-card-foreground shadow-xs">
        <div class="flex flex-col space-y-1.5 p-6 pb-0">
          <h3 class="text-lg font-semibold leading-none tracking-tight">Create Project</h3>
          <p class="text-sm text-muted-foreground">Deploy your new project in one-click.</p>
        </div>
        <div class="p-6">
          <div class="flex flex-col gap-4">
            <div class="w-full max-w-sm grid gap-2">
              <label for="name" class="text-sm font-medium leading-none inline-block" data-tui-label-disabled-style="opacity-50 cursor-not-allowed">Name</label>
              <div class="relative w-full">
                <input id="name" type="text" placeholder="Enter project name" class="flex h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none md:text-sm dark:bg-input/30 selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:ring-destructive/20 aria-invalid:border-destructive dark:aria-invalid:ring-destructive/40"/>
              </div>
            </div>
            <div class="w-full max-w-sm grid gap-2">
              <label for="service" class="text-sm font-medium leading-none inline-block" data-tui-label-disabled-style="opacity-50 cursor-not-allowed">Service</label>
              <div class="select-container w-full relative">
                <div data-tui-popover-root="" class="contents">
                  <span class="contents" data-tui-popover-trigger="" data-tui-popover-type="click">
                    <button id="service" type="button" class="select-trigger w-full h-9 px-3 py-1 text-base md:text-sm flex items-center justify-between rounded-md border border-input bg-transparent shadow-xs transition-[color,box-shadow] outline-none dark:bg-input/30 selection:bg-primary selection:text-primary-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 aria-invalid:border-destructive dark:aria-invalid:ring-destructive/40" data-tui-selectbox-multiple="false" data-tui-selectbox-show-pills="false" data-tui-selectbox-selected-count-text="" tabindex="0">
                      <input type="hidden" data-tui-selectbox-hidden-input=""/>
                      <span class="block truncate select-value text-muted-foreground" data-tui-selectbox-placeholder="Select">Select</span>
                      <span class="ml-1 hidden cursor-pointer text-muted-foreground hover:text-foreground" data-tui-selectbox-clear-trigger="" aria-label="Clear selection" role="button"/>
                      <span class="pointer-events-none ml-1" data-tui-selectbox-chevron=""/>
                    </button>
                  </span>
                  <div class="p-1 select-content z-50 overflow-hidden rounded-md border bg-popover text-popover-foreground shadow-md" popover="manual" data-tui-popover-content="" data-tui-popover-open="false" data-tui-popover-placement="bottom-start" data-tui-popover-offset="4" data-tui-popover-disable-esc="true" data-tui-popover-exclusive="true" role="listbox" tabindex="-1" data-tui-selectbox-content="true">
                    <div class="w-full overflow-hidden">
                      <div class="sticky top-0 bg-popover p-1">
                        <div class="relative">
                          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground z-10 pointer-events-none"/>
                          <input type="search" class="pl-8 flex h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none md:text-sm placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px]" placeholder="Search..." data-tui-selectbox-search=""/>
                        </div>
                      </div>
                      <div class="max-h-[300px] overflow-y-auto">
                        <div class="p-1" role="group">
                          <div class="select-item group relative flex w-full cursor-default select-none items-center rounded-sm py-1.5 px-2 text-sm font-light outline-none hover:bg-accent hover:text-accent-foreground focus-visible:bg-accent focus-visible:text-accent-foreground data-[tui-selectbox-selected=true]:bg-accent data-[tui-selectbox-selected=true]:text-accent-foreground" role="option" data-tui-selectbox-value="postgres" data-tui-selectbox-selected="false" data-tui-selectbox-disabled="false" tabindex="0">
                            <span class="truncate select-item-text">PostgreSQL</span>
                            <span class="select-check absolute right-2 flex h-3.5 w-3.5 items-center justify-center opacity-0 group-data-[tui-selectbox-selected=true]:opacity-100"/>
                          </div>
                          <div class="select-item group relative flex w-full cursor-default select-none items-center rounded-sm py-1.5 px-2 text-sm font-light outline-none hover:bg-accent hover:text-accent-foreground focus-visible:bg-accent focus-visible:text-accent-foreground data-[tui-selectbox-selected=true]:bg-accent data-[tui-selectbox-selected=true]:text-accent-foreground" role="option" data-tui-selectbox-value="mysql" data-tui-selectbox-selected="false" data-tui-selectbox-disabled="false" tabindex="0">
                            <span class="truncate select-item-text">MySQL</span>
                            <span class="select-check absolute right-2 flex h-3.5 w-3.5 items-center justify-center opacity-0 group-data-[tui-selectbox-selected=true]:opacity-100"/>
                          </div>
                          <div class="select-item group relative flex w-full cursor-default select-none items-center rounded-sm py-1.5 px-2 text-sm font-light outline-none hover:bg-accent hover:text-accent-foreground focus-visible:bg-accent focus-visible:text-accent-foreground data-[tui-selectbox-selected=true]:bg-accent data-[tui-selectbox-selected=true]:text-accent-foreground" role="option" data-tui-selectbox-value="sqlite" data-tui-selectbox-selected="false" data-tui-selectbox-disabled="false" tabindex="0">
                            <span class="truncate select-item-text">SQLite</span>
                            <span class="select-check absolute right-2 flex h-3.5 w-3.5 items-center justify-center opacity-0 group-data-[tui-selectbox-selected=true]:opacity-100"/>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="flex items-center p-6 pt-0 flex justify-between">
          <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive cursor-pointer bg-secondary text-secondary-foreground shadow-xs hover:bg-secondary/80 h-9 px-4 py-2 has-[&gt;svg]:px-3" type="button">Cancel</button>
          <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive cursor-pointer bg-primary text-primary-foreground shadow-xs hover:bg-primary/90 h-9 px-4 py-2 has-[&gt;svg]:px-3" type="button">Deploy</button>
        </div>
      </div>
    </div>
  </body>
</html>
