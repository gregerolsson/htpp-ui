<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>breadcrumb_default</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <nav class="flex" aria-label="Breadcrumb">
      <ol class="flex items-center flex-wrap gap-1 text-sm">
        <li class="flex items-center">
          <a href="/" class="text-muted-foreground hover:text-foreground hover:underline flex items-center gap-1.5 transition-colors">Home</a>
        </li>
        <li class="flex items-center">
          <span class="mx-2 text-muted-foreground"/>
          <a href="/docs" class="text-muted-foreground hover:text-foreground hover:underline flex items-center gap-1.5 transition-colors">Documentation</a>
        </li>
        <li class="flex items-center">
          <span class="mx-2 text-muted-foreground"/>
          <span class="font-medium text-foreground flex items-center gap-1.5" aria-current="page">Components</span>
        </li>
      </ol>
    </nav>
  </body>
</html>
