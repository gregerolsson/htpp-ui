<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>breadcrumb_responsive</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div class="md:hidden">
      <nav class="flex" aria-label="Breadcrumb">
        <ol class="flex items-center flex-wrap gap-1 text-sm">
          <li class="flex items-center">
            <a href="/" class="text-muted-foreground hover:text-foreground hover:underline flex items-center gap-1.5 transition-colors">Home</a>
          </li>
          <span class="mx-2 text-muted-foreground"/>
          <li class="flex items-center">
            <a href="#" class="text-muted-foreground hover:text-foreground hover:underline flex items-center gap-1.5 transition-colors">...</a>
          </li>
          <span class="mx-2 text-muted-foreground"/>
          <li class="flex items-center">
            <span class="font-medium text-foreground flex items-center gap-1.5" aria-current="page">Current Page</span>
          </li>
        </ol>
      </nav>
    </div>
    <div class="hidden md:block">
      <nav class="flex" aria-label="Breadcrumb">
        <ol class="flex items-center flex-wrap gap-1 text-sm">
          <li class="flex items-center">
            <a href="/" class="text-muted-foreground hover:text-foreground hover:underline flex items-center gap-1.5 transition-colors">Home</a>
          </li>
          <span class="mx-2 text-muted-foreground"/>
          <li class="flex items-center">
            <a href="/category" class="text-muted-foreground hover:text-foreground hover:underline flex items-center gap-1.5 transition-colors">Category</a>
          </li>
          <span class="mx-2 text-muted-foreground"/>
          <li class="flex items-center">
            <a href="/category/subcategory" class="text-muted-foreground hover:text-foreground hover:underline flex items-center gap-1.5 transition-colors">Subcategory</a>
          </li>
          <span class="mx-2 text-muted-foreground"/>
          <li class="flex items-center">
            <span class="font-medium text-foreground flex items-center gap-1.5" aria-current="page">Current Page</span>
          </li>
        </ol>
      </nav>
    </div>
  </body>
</html>
