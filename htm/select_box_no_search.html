<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>select_box_no_search</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div class="w-full max-w-sm">
      <div class="select-container w-full relative">
        <div data-tui-popover-root="" class="contents">
          <span class="contents" data-tui-popover-trigger="" data-tui-popover-type="click">
            <button type="button" class="select-trigger w-full h-9 px-3 py-1 text-base md:text-sm flex items-center justify-between rounded-md border border-input bg-transparent shadow-xs transition-[color,box-shadow] outline-none dark:bg-input/30 selection:bg-primary selection:text-primary-foreground focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 aria-invalid:border-destructive dark:aria-invalid:ring-destructive/40" data-tui-selectbox-multiple="false" data-tui-selectbox-show-pills="false" data-tui-selectbox-selected-count-text="" tabindex="0">
              <input type="hidden" data-tui-selectbox-hidden-input=""/>
              <span class="block truncate select-value text-muted-foreground" data-tui-selectbox-placeholder="Select a fruit">Select a fruit</span>
              <span class="ml-1 hidden cursor-pointer text-muted-foreground hover:text-foreground" data-tui-selectbox-clear-trigger="" aria-label="Clear selection" role="button"/>
              <span class="pointer-events-none ml-1" data-tui-selectbox-chevron=""/>
            </button>
          </span>
          <div class="p-1 select-content z-50 overflow-hidden rounded-md border bg-popover text-popover-foreground shadow-md" popover="manual" data-tui-popover-content="" data-tui-popover-open="false" data-tui-popover-placement="bottom-start" data-tui-popover-offset="4" data-tui-popover-disable-esc="false" data-tui-popover-exclusive="true" role="listbox" tabindex="-1" data-tui-selectbox-content="true">
            <div class="w-full overflow-hidden">
              <div class="max-h-[300px] overflow-y-auto">
                <div class="p-1" role="group">
                  <span class="px-2 py-1.5 text-sm font-medium">Fruits</span>
                  <div class="select-item group relative flex w-full cursor-default select-none items-center rounded-sm py-1.5 px-2 text-sm font-light outline-none hover:bg-accent hover:text-accent-foreground focus-visible:bg-accent focus-visible:text-accent-foreground data-[tui-selectbox-selected=true]:bg-accent data-[tui-selectbox-selected=true]:text-accent-foreground" role="option" data-tui-selectbox-value="apple" data-tui-selectbox-selected="false" data-tui-selectbox-disabled="false" tabindex="0">
                    <span class="truncate select-item-text">Apple</span>
                    <span class="select-check absolute right-2 flex h-3.5 w-3.5 items-center justify-center opacity-0 group-data-[tui-selectbox-selected=true]:opacity-100"/>
                  </div>
                  <div class="select-item group relative flex w-full cursor-default select-none items-center rounded-sm py-1.5 px-2 text-sm font-light outline-none hover:bg-accent hover:text-accent-foreground focus-visible:bg-accent focus-visible:text-accent-foreground data-[tui-selectbox-selected=true]:bg-accent data-[tui-selectbox-selected=true]:text-accent-foreground" role="option" data-tui-selectbox-value="banana" data-tui-selectbox-selected="false" data-tui-selectbox-disabled="false" tabindex="0">
                    <span class="truncate select-item-text">Banana</span>
                    <span class="select-check absolute right-2 flex h-3.5 w-3.5 items-center justify-center opacity-0 group-data-[tui-selectbox-selected=true]:opacity-100"/>
                  </div>
                  <div class="select-item group relative flex w-full cursor-default select-none items-center rounded-sm py-1.5 px-2 text-sm font-light outline-none hover:bg-accent hover:text-accent-foreground focus-visible:bg-accent focus-visible:text-accent-foreground data-[tui-selectbox-selected=true]:bg-accent data-[tui-selectbox-selected=true]:text-accent-foreground" role="option" data-tui-selectbox-value="blueberry" data-tui-selectbox-selected="false" data-tui-selectbox-disabled="false" tabindex="0">
                    <span class="truncate select-item-text">Blueberry</span>
                    <span class="select-check absolute right-2 flex h-3.5 w-3.5 items-center justify-center opacity-0 group-data-[tui-selectbox-selected=true]:opacity-100"/>
                  </div>
                  <div class="select-item group relative flex w-full cursor-default select-none items-center rounded-sm py-1.5 px-2 text-sm font-light outline-none hover:bg-accent hover:text-accent-foreground focus-visible:bg-accent focus-visible:text-accent-foreground data-[tui-selectbox-selected=true]:bg-accent data-[tui-selectbox-selected=true]:text-accent-foreground" role="option" data-tui-selectbox-value="grapes" data-tui-selectbox-selected="false" data-tui-selectbox-disabled="false" tabindex="0">
                    <span class="truncate select-item-text">Grapes</span>
                    <span class="select-check absolute right-2 flex h-3.5 w-3.5 items-center justify-center opacity-0 group-data-[tui-selectbox-selected=true]:opacity-100"/>
                  </div>
                  <div class="select-item group relative flex w-full cursor-default select-none items-center rounded-sm py-1.5 px-2 text-sm font-light outline-none hover:bg-accent hover:text-accent-foreground focus-visible:bg-accent focus-visible:text-accent-foreground data-[tui-selectbox-selected=true]:bg-accent data-[tui-selectbox-selected=true]:text-accent-foreground" role="option" data-tui-selectbox-value="pineapple" data-tui-selectbox-selected="false" data-tui-selectbox-disabled="false" tabindex="0">
                    <span class="truncate select-item-text">Pineapple</span>
                    <span class="select-check absolute right-2 flex h-3.5 w-3.5 items-center justify-center opacity-0 group-data-[tui-selectbox-selected=true]:opacity-100"/>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
