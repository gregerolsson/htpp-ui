<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>slider_external_value</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div class="space-y-6 w-full max-w-sm">
      <div id="slider-external-value" data-tui-slider="" data-min="0" data-max="100" data-step="1" class="relative flex items-center w-full select-none">
        <div data-track="" class="relative w-full h-2 rounded-full bg-secondary">
          <div data-fill="" class="absolute inset-y-0 rounded-full bg-primary pointer-events-none" style="left:0%;right:50.00%"/>
          <div data-thumb="" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" style="left:50.00%" class="absolute top-1/2 size-4 -translate-x-1/2 -translate-y-1/2 rounded-full bg-primary touch-none ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 hover:bg-primary/90 cursor-grab active:cursor-grabbing"/>
        </div>
        <input data-input="" type="hidden" value="50"/>
      </div>
      <div class="bg-muted p-4 rounded-md">
        <p class="text-sm text-muted-foreground mb-2">External value (linked to the slider):</p>
        <div class="text-3xl font-bold flex gap-1"><span data-tui-slider-value="" data-tui-slider-value-for="slider-external-value" class="text-3xl text-primary font-bold"/>%</div>
      </div>
    </div>
  </body>
</html>
