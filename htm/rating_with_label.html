<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>rating_with_label</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div class="items-center">
      <div class="flex flex-col gap-2">
        <label for="rating-with-label" class="text-sm font-medium leading-none inline-block" data-tui-label-disabled-style="opacity-50 cursor-not-allowed">Fruit</label>
        <div data-tui-rating-component="" data-tui-rating-initial-value="2.000000" data-tui-rating-precision="0.000000" data-tui-rating-readonly="false" data-tui-rating-onlyinteger="false" class="flex flex-col items-start gap-1">
          <div class="flex flex-row items-center gap-1">
            <div data-tui-rating-item="" data-tui-rating-value="1" class="relative text-yellow-400 transition-opacity cursor-pointer">
              <div class="opacity-30"/>
              <div class="absolute inset-0 overflow-hidden w-0" data-tui-rating-item-foreground=""/>
            </div>
            <div data-tui-rating-item="" data-tui-rating-value="2" class="relative text-yellow-400 transition-opacity cursor-pointer">
              <div class="opacity-30"/>
              <div class="absolute inset-0 overflow-hidden w-0" data-tui-rating-item-foreground=""/>
            </div>
            <div data-tui-rating-item="" data-tui-rating-value="3" class="relative text-yellow-400 transition-opacity cursor-pointer">
              <div class="opacity-30"/>
              <div class="absolute inset-0 overflow-hidden w-0" data-tui-rating-item-foreground=""/>
            </div>
            <div data-tui-rating-item="" data-tui-rating-value="4" class="relative text-yellow-400 transition-opacity cursor-pointer">
              <div class="opacity-30"/>
              <div class="absolute inset-0 overflow-hidden w-0" data-tui-rating-item-foreground=""/>
            </div>
            <div data-tui-rating-item="" data-tui-rating-value="5" class="relative text-yellow-400 transition-opacity cursor-pointer">
              <div class="opacity-30"/>
              <div class="absolute inset-0 overflow-hidden w-0" data-tui-rating-item-foreground=""/>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
