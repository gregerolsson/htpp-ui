<?xml version="1.0"?>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>avatar_group</title>
    <link rel="stylesheet" href="./index.css"/>
  </head>
  <body>
    <div class="flex -space-x-3 *:ring-2 *:ring-background">
      <div class="relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full" data-tui-avatar="">
        <img src="https://avatars.githubusercontent.com/u/26936893?v=4" alt="User avatar" class="aspect-square h-full w-full" data-tui-avatar-image=""/>
        <span class="flex h-full w-full items-center justify-center rounded-full bg-muted" data-tui-avatar-fallback="">AA</span>
      </div>
      <div class="relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full" data-tui-avatar="">
        <img src="https://avatars.githubusercontent.com/u/26936893?v=4" alt="User avatar" class="aspect-square h-full w-full" data-tui-avatar-image=""/>
        <span class="flex h-full w-full items-center justify-center rounded-full bg-muted" data-tui-avatar-fallback="">BB</span>
      </div>
      <div class="relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full" data-tui-avatar="">
        <img src="https://avatars.githubusercontent.com/u/26936893?v=4" alt="User avatar" class="aspect-square h-full w-full" data-tui-avatar-image=""/>
        <span class="flex h-full w-full items-center justify-center rounded-full bg-muted" data-tui-avatar-fallback="">CC</span>
      </div>
      <div class="relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full text-muted-foreground" data-tui-avatar="">
        <span class="flex h-full w-full items-center justify-center rounded-full bg-muted" data-tui-avatar-fallback="">+2</span>
      </div>
    </div>
  </body>
</html>
